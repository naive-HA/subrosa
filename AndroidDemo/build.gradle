plugins {
    id 'com.android.application'
    id 'project-convention-spotbugs'
    id 'project-convention-logging'
}

android {
    compileSdkVersion 37

    defaultConfig {
        minSdkVersion 31
        targetSdkVersion 37
        versionName = version
        versionCode = 14

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        dex {
            useLegacyPackaging = true
        }
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "/META-INF/LICENSE.md"
            excludes += "/META-INF/NOTICE.md"
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    namespace = 'acab.naiveha.subrosa'
}

androidComponents {
    onVariants(selector().all(), { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("subrosa." + project.version + ".apk")
        }
    })
}

// Rename the release bundle to match the APK naming convention
afterEvaluate {
    def renameTask = tasks.register("renameReleaseBundle") {
        doLast {
            def bundleDir = project.file("release")
            def bundleFile = new File(bundleDir, "AndroidDemo-release.aab")
            if (bundleFile.exists()) {
                def renamedFile = new File(bundleDir, "subrosa.${project.version}.aab")
                ant.move(file: bundleFile, tofile: renamedFile)
                logger.lifecycle("Renamed AAB to: ${renamedFile.name}")
            } else {
                logger.warn("Release bundle not found at: ${bundleFile.absolutePath}")
            }
        }
    }

    if (tasks.findByName("bundleRelease")) {
        tasks.named("bundleRelease").configure {
            finalizedBy(renameTask)
        }
    }
}

dependencies {

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation project(':android')
    implementation project(':management')
    implementation project(':fido')
    implementation project(':yubiotp')
    implementation project(':openpgp')
    implementation project(':support')

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:2.10.2"
    implementation "androidx.navigation:navigation-ui-ktx:2.10.2"
    //implementation "androidx.navigation:navigation-dynamic-features-fragment:$nav_version"

    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    implementation 'org.bouncycastle:bcpg-jdk18on:1.86'

    implementation 'com.github.tony19:logback-android:3.0.0'

    implementation "cz.adaptech.tesseract4android:tesseract4android-openmp:4.9.0"

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

}
